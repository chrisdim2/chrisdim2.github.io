<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Οι εφαρμογές μας</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font: -apple-system-body, -apple-system, system-ui, "Segoe UI", sans-serif;
    line-height: 1.6; margin: 0 auto; padding: 56px 20px 80px;
    max-width: 40em; color: #111; background: #fff;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #e8e8ea; background: #000; }
    .card { background: #1c1c1e !important; border-color: #2c2c2e !important; }
    a.card:hover { background: #2c2c2e !important; }
  }
  header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: 2em; margin: 0 0 .1em; letter-spacing: -.02em; }
  .tagline { color: #888; margin: 0; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: #f6f6f7; border: 1px solid #e5e5e7; border-radius: 12px;
    padding: 16px 18px; margin: 12px 0; transition: background .15s;
  }
  a.card:hover { background: #ececee; }
  .card strong { display: block; font-size: 1.05em; }
  .card span { color: #888; font-size: .9em; }
  footer { margin-top: 48px; text-align: center; color: #888; font-size: .88em; }
  a { color: #0a84ff; }
</style>
</head>
<body>

<header>
  <h1>Οι εφαρμογές μας</h1>
  <p class="tagline">Υποστήριξη και νομικά κείμενα</p>
</header>

<a class="card" href="apollo/">
  <strong>Apollo</strong>
  <span>Άλμπουμ φωτογραφιών</span>
</a>

<a class="card" href="chronos/">
  <strong>Chronos</strong>
  <span>Ημερολόγιο &amp; Οργάνωση</span>
</a>

<!--
  ΓΙΑ ΚΑΘΕ ΝΕΑ ΕΦΑΡΜΟΓΗ: αντίγραψε τον φάκελο chronos/, μετονόμασέ τον,
  άλλαξε τα κείμενα, και πρόσθεσε εδώ μία ακόμη κάρτα:

  <a class="card" href="athena/">
    <strong>Athena</strong>
    <span>Σύντομη περιγραφή</span>
  </a>
-->

<footer>
  <p>Κάθε εφαρμογή έχει τη δική της διεύθυνση υποστήριξης, στη σελίδα της.</p>
  <p>© <span id="y">2026</span> Χρήστος Δημάκης</p>
</footer>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>

</body>
</html>
