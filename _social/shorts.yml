# Σενάρια για YouTube Shorts (και Reels / TikTok): ένα για κάθε άρθρο του site.
# Κάθετο βίντεο 1080×1920, χωρίς αφήγηση: κείμενο πάνω στην οθόνη στα αγγλικά, μουσική από την YouTube Audio Library.
# t: [αρχή, τέλος] σε δευτερόλεπτα. en: κείμενο οθόνης (και αγγλικοί υπότιτλοι). el: ελληνικοί υπότιτλοι.
# shot: τι δείχνει η οθόνη (οδηγία εγγραφής). Χαρακτηριστικά μόνο από τα άρθρα, τίποτα από το «Μένω στην Ελλάδα».
# Υπότιτλοι: ruby _tools/social_srt.rb → _social/subtitles/<id>.en.srt και .el.srt.
# Αν στο μοντάζ αλλάξουν οι χρόνοι, διόρθωσε εδώ τα t και ξανατρέξε το script.
# Τελική κάρτα: _social/images/yt-endcard-<app>.png (τα τελευταία 3 δευτερόλεπτα κάθε βίντεο).

- id: 01-countdown
  app: chronos
  title_en: How many days until your holiday? Countdowns with a photo on iPhone
  title_el: Πόσες μέρες μένουν για τις διακοπές; Αντίστροφη μέτρηση με φωτογραφία στο iPhone
  article: countdown-iphone
  record: iPhone. Λίστα αντίστροφων μετρήσεων, μετά δημιουργία νέας με φωτογραφία, μετά κοινοποίηση.
  scenes:
    - {t: [0, 3], en: "How many days until…?", el: "Πόσες μέρες μένουν…;", shot: "Η λίστα αντίστροφων μετρήσεων του Chronos, ακίνητη"}
    - {t: [3, 8], en: "Tap ⏱ and give it a name, a date and a photo", el: "Πάτα ⏱ και δώσε όνομα, ημερομηνία και φωτογραφία", shot: "Πάτημα στο ⏱, πληκτρολόγηση «Summer holiday», επιλογή ημερομηνίας και φωτογραφίας"}
    - {t: [8, 12], en: "Days, weeks, months or years", el: "Σε μέρες, εβδομάδες, μήνες ή χρόνια", shot: "Αλλαγή μορφής μέτρησης"}
    - {t: [12, 16], en: "A reminder up to a month before", el: "Υπενθύμιση έως και έναν μήνα πριν", shot: "Ρύθμιση ειδοποίησης"}
    - {t: [16, 20], en: "Birthdays show the age, every year", el: "Στα γενέθλια δείχνει την ηλικία, κάθε χρόνο", shot: "Η κάρτα «Emma's birthday, 36 years old»"}
    - {t: [20, 25], en: "Send it to a friend, with the same photo", el: "Στείλ' τη σε φίλο, με την ίδια φωτογραφία", shot: "Παρατεταμένο πάτημα στην κάρτα → Share → AirDrop ή Messages"}
    - {t: [25, 28], en: "Chronos · dimakis.app/chronos", el: "Chronos · dimakis.app/chronos", shot: "Τελική κάρτα yt-endcard-chronos.png"}

- id: 02-remove-location
  app: iris
  title_en: Your photo may show where you live. Remove the location before you share it
  title_el: Η φωτογραφία σου μπορεί να δείχνει πού μένεις. Σβήσε την τοποθεσία πριν τη στείλεις
  article: remove-location-from-photos
  record: Πρώτα iPhone (φύλλο κοινοποίησης), μετά Mac με Iris. Στο μοντάζ, το Mac κομμένο κάθετα στο σημείο που αλλάζει.
  scenes:
    - {t: [0, 3], en: "This photo may show where you live", el: "Αυτή η φωτογραφία μπορεί να δείχνει πού μένεις", shot: "Φωτογραφία αντικειμένου για πώληση, με χάρτη τοποθεσίας από κάτω (Πληροφορίες στις Φωτογραφίες)"}
    - {t: [3, 9], en: "On iPhone: Share → Options → turn off Location", el: "Στο iPhone: Κοινοποίηση → Επιλογές → κλείσε την Τοποθεσία", shot: "Φύλλο κοινοποίησης, «Επιλογές», διακόπτης Τοποθεσίας"}
    - {t: [9, 13], en: "Many photos? Iris on Mac", el: "Πολλές φωτογραφίες; Iris στο Mac", shot: "Iris με φάκελο φωτογραφιών"}
    - {t: [13, 19], en: "Clean for Privacy removes all metadata: location, date, device", el: "Το Clean for Privacy σβήνει όλα τα μεταδεδομένα: τοποθεσία, ημερομηνία, συσκευή", shot: "Επιλογή αρχείων, Clean for Privacy, το παράθυρο «Remove all metadata?»"}
    - {t: [19, 23], en: "All on your Mac. Nothing is uploaded", el: "Όλα στο Mac σου. Τίποτα δεν ανεβαίνει", shot: "Το αποτέλεσμα: τα αρχεία χωρίς τοποθεσία"}
    - {t: [23, 26], en: "Iris · dimakis.app/iris", el: "Iris · dimakis.app/iris", shot: "Τελική κάρτα yt-endcard-iris.png"}

- id: 03-trips
  app: apollo
  title_en: Your photos already know every trip. Turn them into a travel map
  title_el: Οι φωτογραφίες σου ξέρουν ήδη κάθε ταξίδι. Κάν' τες χάρτη ταξιδιών
  article: trips-from-your-photos
  record: iPhone, Apollo. Καρτέλα ταξιδιών, ένα ταξίδι, στατιστικά, εισιτήριο.
  scenes:
    - {t: [0, 3], en: "Your photos already know every trip", el: "Οι φωτογραφίες σου ξέρουν ήδη κάθε ταξίδι", shot: "Ο χάρτης ταξιδιών του Apollo, ακίνητος"}
    - {t: [3, 8], en: "Apollo finds them by itself, from dates and places", el: "Το Apollo τα βρίσκει μόνο του, από ημερομηνίες και τοποθεσίες", shot: "Λίστα ταξιδιών, κύλιση"}
    - {t: [8, 13], en: "Each trip: a map, its days and its photos", el: "Κάθε ταξίδι: χάρτης, μέρες και φωτογραφίες", shot: "Άνοιγμα ενός ταξιδιού (π.χ. Crete)"}
    - {t: [13, 17], en: "Distance and countries, per year", el: "Χιλιόμετρα και χώρες, ανά έτος", shot: "Στατιστικά"}
    - {t: [17, 22], en: "Boarding passes and ferry tickets, filed under the right trip", el: "Κάρτες επιβίβασης και εισιτήρια πλοίου, στο σωστό ταξίδι", shot: "Καρτέλα εισιτηρίων, σάρωση ή άνοιγμα ενός"}
    - {t: [22, 25], en: "Apollo · dimakis.app/apollo", el: "Apollo · dimakis.app/apollo", shot: "Τελική κάρτα yt-endcard-apollo.png"}

