  record: Mac, Iris. Φάκελος με σκαναρισμένες ή WhatsApp φωτογραφίες. Στο μοντάζ κάθετο κόψιμο.
  scenes:
    - {t: [0, 3], en: "Your 2015 trip, filed under 2023?", el: "Το ταξίδι του 2015, στο 2023;", shot: "Φωτογραφίες σε λάθος χρονιά (Φωτογραφίες ή Apollo)"}
    - {t: [3, 8], en: "Scans, WhatsApp, or a camera with the wrong clock", el: "Σκαναρισμένες, από WhatsApp ή κάμερα με λάθος ρολόι", shot: "Λίστα αρχείων στο Iris με «no date»"}
    - {t: [8, 14], en: "Iris suggests the date from the file name", el: "Το Iris προτείνει ημερομηνία από το όνομα του αρχείου", shot: "IMG-20190814-WA0012.jpg → Get Date from File Name → 14 Αυγούστου 2019"}
    - {t: [14, 19], en: "Wrong camera clock? Shift them all at once", el: "Λάθος ρολόι; Μετατόπισε όλες μαζί", shot: "Επιλογή πολλών αρχείων, Shift +3 ώρες"}
    - {t: [19, 23], en: "Written inside the files. Every app sees it", el: "Γράφεται μέσα στα αρχεία. Το βλέπει κάθε εφαρμογή", shot: "Οι φωτογραφίες στη σωστή χρονιά"}
    - {t: [23, 26], en: "Iris · dimakis.app/iris", el: "Iris · dimakis.app/iris", shot: "Τελική κάρτα yt-endcard-iris.png"}

