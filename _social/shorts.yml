- id: 05-fix-photo-dates
  app: iris
  title_en: Why your old photos show up in the wrong year (and how to fix it on Mac)
  title_el: Γιατί οι παλιές φωτογραφίες εμφανίζονται σε λάθος χρονιά (και πώς το διορθώνεις στο Mac)
