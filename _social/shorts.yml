    - {t: [8, 13], en: "In Chronos: all of them, with totals per month and year", el: "Στο Chronos: όλες, με σύνολα ανά μήνα και χρόνο", shot: "Chronos → Παρακολούθηση → Συνδρομές, τα σύνολα"}
