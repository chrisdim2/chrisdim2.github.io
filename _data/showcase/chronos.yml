# Παρουσίαση του Chronos: σύνθεση συσκευών και γκαλερί ανά συσκευή (iPhone, iPad, Mac, Apple Watch) και βίντεο.
# Οι εικόνες βγαίνουν από το CalendarApp/Marketing (screenshots/<γλώσσα>/.../plain). Το βίντεο: video/<γλώσσα>_site_web.mp4.
# src: ελληνικό UI, src_en: αγγλικό UI. only: el = εμφανίζεται μόνο στην ελληνική σελίδα (λειτουργίες μόνο για Ελλάδα).

stage:
  wide: /assets/screens/chronos/mac/el/chronos-mac-01-month.webp
  wide_en: /assets/screens/chronos/mac/en/chronos-mac-01-month.webp
  phone: /assets/screens/chronos/iphone/el/chronos-iphone-01-home.webp
  phone_en: /assets/screens/chronos/iphone/en/chronos-iphone-01-home.webp
  ipad: /assets/screens/chronos/ipad/el/chronos-ipad-01-month.webp
  ipad_en: /assets/screens/chronos/ipad/en/chronos-ipad-01-month.webp
  watch: /assets/screens/chronos/watch/el/chronos-watch-01-date.webp
  watch_en: /assets/screens/chronos/watch/en/chronos-watch-01-date.webp

groups:
  - id: iphone
    device: phone
    label_el: iPhone
    label_en: iPhone
    shots:
      - src: /assets/screens/chronos/iphone/el/chronos-iphone-01-home.webp
        src_en: /assets/screens/chronos/iphone/en/chronos-iphone-01-home.webp
