        src_en: /assets/screens/chronos/iphone/en/chronos-iphone-07-weather.webp
        el: 'Καιρός για κάθε μέρα'
        en: 'Weather for every day'
      - src: /assets/screens/chronos/iphone/el/chronos-iphone-08-countdown.webp
