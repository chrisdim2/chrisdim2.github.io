# Παρουσίαση του Apollo: σύνθεση συσκευών και γκαλερί ανά συσκευή (iPhone, iPad, Mac) και βίντεο.
# Οι εικόνες βγαίνουν από το PhotoApp/Marketing (screenshots/<γλώσσα>/.../plain): iPhone σε ανοιχτό,
# iPad και Mac σε σκούρο θέμα, φωτογραφίες επίδειξης με πουλιά. src: ελληνικό UI, src_en: αγγλικό. Βίντεο: video/<γλώσσα>_site_web.mp4.

stage:
  wide: /assets/screens/apollo/mac/el/apollo-mac-01-timeline.webp
  wide_en: /assets/screens/apollo/mac/en/apollo-mac-01-timeline.webp
  phone: /assets/screens/apollo/iphone/el/apollo-iphone-01-timeline.webp
  phone_en: /assets/screens/apollo/iphone/en/apollo-iphone-01-timeline.webp
  ipad: /assets/screens/apollo/ipad/el/apollo-ipad-01-timeline.webp
  ipad_en: /assets/screens/apollo/ipad/en/apollo-ipad-01-timeline.webp

groups:
  - id: iphone
    device: phone
    label_el: iPhone
    label_en: iPhone
    shots:
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-01-timeline.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-01-timeline.webp
        el: 'Χρονολόγιο με «Σαν σήμερα»'
        en: 'Timeline with “On this day”'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-02-search-ai.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-02-search-ai.webp
        el: 'Γράψε «πουλιά» και τα βρίσκει'
        en: 'Type “birds” and it finds them'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-03-viewer.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-03-viewer.webp
        el: 'Προβολή σε πλήρη οθόνη'
        en: 'Full-screen viewer'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-04-date-place.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-04-date-place.webp
        el: 'Διόρθωση ημερομηνίας και τοποθεσίας'
        en: 'Fix date and location'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-05-edit.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-05-edit.webp
        el: 'Επεξεργασία φωτογραφίας'
        en: 'Photo editing'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-06-select.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-06-select.webp
        el: 'Μαζικές ενέργειες σε πολλές φωτογραφίες'
        en: 'Bulk actions on many photos'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-07-collage-shapes.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-07-collage-shapes.webp
        el: 'Κολάζ με σχήματα'
        en: 'Shaped collages'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-08-albums.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-08-albums.webp
        el: 'Άλμπουμ ανά έτος, με το καλύτερο εξώφυλλο'
        en: 'Albums by year, with the best cover'
      - src: /assets/screens/apollo/iphone/el/apollo-iphone-09-trips.webp
        src_en: /assets/screens/apollo/iphone/en/apollo-iphone-09-trips.webp
        el: 'Ταξίδια που βρίσκει μόνο του'
        en: 'Trips it finds on its own'
