  og_image: /assets/og/apollo.jpg
  order: 2
  platforms: [iphone, ipad, mac]
  has_legal: true
  support_email: apollo@dimakis.app
  appstore_url: ''
  appstore_id: ''
  price: ''
  ready: true
  schema_category: PhotographyApplication
  description_el: 'Οικογενειακό άλμπουμ που δουλεύει πάνω στο δικό σου cloud: άλμπουμ ανά έτος, χάρτης, ταξίδια και έξυπνη αναζήτηση, μόνο μέσα στη συσκευή.'
  description_en: 'A family photo album that works right on your own cloud: albums by year, a map, automatic trips and smart search, all on your device.'
  press_long_el: |
    Το Apollo είναι οικογενειακό άλμπουμ φωτογραφιών για iPhone, iPad και Mac που δεν αντιγράφει τίποτα. Δουλεύει απευθείας πάνω στις φωτογραφίες που έχεις ήδη στο pCloud, στο Dropbox, στο OneDrive και σε άλλες υπηρεσίες, και τις οργανώνει σε άλμπουμ ανά έτος και σε χάρτη, με τις πραγματικές ημερομηνίες και τοποθεσίες λήψης.

    Η έξυπνη ανάλυση γίνεται μόνο μέσα στη συσκευή: γράφεις «θάλασσα» ή «σκύλος» και βρίσκει τις φωτογραφίες, διαλέγει τα καλύτερα εξώφυλλα και εντοπίζει τις διπλές. Τα ταξίδια βγαίνουν μόνα τους από τις φωτογραφίες σου, μαζί με κάρτες επιβίβασης, ακτοπλοϊκά εισιτήρια και στατιστικά χιλιομέτρων και χωρών.

    Με το Family mode, όλη η οικογένεια βλέπει τα ίδια εξώφυλλα, φακέλους και ταξίδια, πάνω στο ίδιο cloud.
  press_long_en: |
    Apollo is a family photo album for iPhone, iPad and Mac that doesn't copy anything. It works directly on the photos you already keep in pCloud, Dropbox, OneDrive and other services, and organises them into albums by year and on a map, using the real capture dates and locations.

    Smart analysis runs on your device only: type “sea” or “dog” to find photos, let it pick the best covers and spot duplicates. Trips are detected automatically from your photos, alongside boarding passes, ferry tickets and distance and country stats.

    With Family mode, everyone in the family sees the same covers, folders and trips, on the same cloud.
  kind_el: Οικογενειακό άλμπουμ φωτογραφιών
  kind_en: Family photo album
  tagline_el: Φως στις αναμνήσεις.
  tagline_en: Light on your memories.
  origin_el: Από τον Απόλλωνα, τον θεό του φωτός και της ομορφιάς.
  origin_en: Named after Apollo, god of light and beauty.
  status_el: Έρχεται σύντομα
  status_en: Coming soon
  features_el:
    - Δεν αντιγράφει τις φωτογραφίες σου — δουλεύει απευθείας πάνω στο δικό σου cloud (pCloud, Dropbox, OneDrive κ.ά.)
    - Άλμπουμ ανά έτος, χάρτης τοποθεσιών, αναζήτηση με πραγματικές ημερομηνίες και GPS από τα EXIF
    - Έξυπνη ανάλυση μόνο στη συσκευή — γράψε «θάλασσα» ή «σκύλος» και τις βρίσκει, διαλέγει τα καλύτερα εξώφυλλα και βρίσκει τις διπλές
    - Ταξίδια που βγαίνουν μόνα τους από τις φωτογραφίες σου — τα εντοπίζει, εσύ απλώς τα ονομάζεις
    - Σάρωση καρτών επιβίβασης και ακτοπλοϊκών εισιτηρίων, με κάμερα ή PDF
    - Υπενθυμίσεις πριν από κάθε ταξίδι, και πλήρη στατιστικά χιλιομέτρων και χωρών
    - Family mode — κοινά εξώφυλλα, φάκελοι και ταξίδια με όποιον μοιράζεται το ίδιο cloud
  features_en:
    - Doesn't copy your photos — works directly on your own cloud (pCloud, Dropbox, OneDrive & more)
    - Albums by year, a map of locations, search by real capture dates and GPS from EXIF
    - Smart analysis, on your device only — type “sea” or “dog” to find them, best photos picked for covers, duplicates found
    - Trips detected automatically from your photos — you just name them
    - Scan boarding passes and ferry tickets, by camera or PDF
    - Reminders before every trip, plus full distance and country stats
    - Family mode — shared covers, folders and trips with everyone on the same cloud
  screenshots:
    - /assets/screens/apollo/mac/el/apollo-mac-01-timeline.webp
    - /assets/screens/apollo/iphone/el/apollo-iphone-01-timeline.webp
