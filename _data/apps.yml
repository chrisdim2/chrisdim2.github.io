list:
- slug: chronos
  title: Chronos
  greek: ΧΡΟΝΟΣ
  icon: /assets/icons/chronos.png
  order: 1
  has_legal: true
  support_email: chronos@dimakis.app
  appstore_url: ''
  kind_el: Ημερολόγιο
  kind_en: Calendar
  tagline_el: Ο χρόνος υπό τον έλεγχό σου.
  tagline_en: Your time, under control.
  origin_el: Από τον Χρόνο, την προσωποποίηση του χρόνου στην ελληνική μυθολογία.
  origin_en: Named after Chronos, the personification of time in Greek mythology.
  status_el: Σε ανάπτυξη
  status_en: In development
  features_el:
    - Έξι όψεις ημερολογίου — Λίστα, Ημέρα, Εβδομάδα, Μήνας, Έτος, και συνδυαστική αρχική
    - Αντίστροφη μέτρηση για γενέθλια, επετείους και ό,τι περιμένεις, με δυνατότητα να τη στείλεις σε φίλο
    - Παρακολούθηση συντήρησης αυτοκινήτου — service, λάδια, ΚΤΕΟ, ασφάλεια, με πλήρες ιστορικό
    - Υπενθυμίσεις φαρμάκων με έλεγχο πιθανών αλληλεπιδράσεων
    - Εφημερεύοντα φαρμακεία και νοσοκομεία κοντά σου, σε πραγματικό χρόνο
    - Δάνεια, συντήρηση σπιτιού και συνδρομές — όλη η καθημερινότητα, σε ένα μέρος
  features_en:
    - Six calendar views — List, Day, Week, Month, Year, and a combined Home view
    - Countdown for birthdays, anniversaries and anything you're waiting for — share it with a friend
    - Car maintenance tracking — service, oil, MOT, insurance, with full history
    - Medication reminders with interaction checks
    - Nearby on-duty pharmacies and hospitals, in real time
    - Loans, home maintenance and subscriptions — your whole life admin, in one place
  screenshots: []
