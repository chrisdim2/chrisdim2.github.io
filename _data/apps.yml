- slug: athena
  title: Athena
  greek: ΑΘΗΝΑ
  icon: /assets/icons/athena.png
  order: 4
  has_legal: false
  support_email: athena@dimakis.app
  appstore_url: ''
  kind_el: Σημειώσεις και τετράδια
  kind_en: Notes & notebooks
  tagline_el: Η σοφία σου, οργανωμένη.
  tagline_en: Your wisdom, organised.
  origin_el: Από την Αθηνά, τη θεά της σοφίας και της στρατηγικής σκέψης.
  origin_en: Named after Athena, goddess of wisdom and strategic thought.
  status_el: Σε ανάπτυξη
  status_en: In development
  features_el:
    - Οι σημειώσεις σου είναι απλά αρχεία Markdown μέσα στο δικό σου cloud — ανοίγουν με οποιοδήποτε εργαλείο
    - Ιεραρχία σαν το OneNote, καθαρότητα σαν τις Σημειώσεις της Apple, views σαν το Trello
    - Πίνακες με τύπους (SUM, AVERAGE...) και υπολογισμοί μέσα στο κείμενο, σαν μίνι υπολογιστικό φύλλο
    - Ηχητικές σημειώσεις με μεταγραφή ομιλίας σε κείμενο, τοπικά στη συσκευή
    - Σάρωση εγγράφων και OCR — το κείμενο μπαίνει αυτόματα στην αναζήτηση
    - Εισαγωγή από OneNote, Apple Notes και άλλα, ώστε να μη χάσεις τίποτα από ό,τι έχεις ήδη
  features_en:
    - Your notes are plain Markdown files in your own cloud — they open in any tool
    - OneNote-style hierarchy, Apple Notes-style clarity, Trello-style views
    - Typed tables (SUM, AVERAGE...) and inline calculations, like a mini spreadsheet
    - Voice notes with on-device speech-to-text transcription
    - Document scanning and OCR — text is instantly searchable
    - Import from OneNote, Apple Notes and more, so you don't lose what you already have
  screenshots: []
- slug: apollo
  title: Apollo
  greek: ΑΠΟΛΛΩΝ
  icon: /assets/icons/apollo.png
  order: 2
  has_legal: true
  support_email: apollo@dimakis.app
  appstore_url: ''
  kind_el: Οικογενειακό άλμπουμ φωτογραφιών
  kind_en: Family photo album
  tagline_el: Φως στις αναμνήσεις.
  tagline_en: Light on your memories.
  origin_el: Από τον Απόλλωνα, τον θεό του φωτός και της ομορφιάς.
  origin_en: Named after Apollo, god of light and beauty.
  status_el: Σε ανάπτυξη
  status_en: In development
  features_el:
    - Δεν αντιγράφει τις φωτογραφίες σου — δουλεύει απευθείας πάνω στο δικό σου cloud (pCloud, Dropbox, OneDrive κ.ά.)
    - Άλμπουμ ανά έτος, χάρτης τοποθεσιών, αναζήτηση με πραγματικές ημερομηνίες και GPS από τα EXIF
    - Ταξίδια που βγαίνουν μόνα τους από τις φωτογραφίες σου — τα εντοπίζει, εσύ απλώς τα ονομάζεις
    - Σάρωση καρτών επιβίβασης και ακτοπλοϊκών εισιτηρίων, με κάμερα ή PDF
    - Υπενθυμίσεις πριν από κάθε ταξίδι, και πλήρη στατιστικά χιλιομέτρων και χωρών
    - Family mode — κοινά εξώφυλλα, φάκελοι και ταξίδια με όποιον μοιράζεται το ίδιο cloud
  features_en:
    - Doesn't copy your photos — works directly on your own cloud (pCloud, Dropbox, OneDrive & more)
    - Albums by year, a map of locations, search by real capture dates and GPS from EXIF
    - Trips detected automatically from your photos — you just name them
    - Scan boarding passes and ferry tickets, by camera or PDF
    - Reminders before every trip, plus full distance and country stats
    - Family mode — shared covers, folders and trips with everyone on the same cloud
  screenshots: []
