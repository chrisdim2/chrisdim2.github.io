  description_el: 'Ημερολόγιο για iPhone, iPad, Mac και Apple Watch με αντίστροφη μέτρηση, υπενθυμίσεις φαρμάκων, συντήρηση αυτοκινήτου και εφημερεύοντα φαρμακεία.'
  description_en: 'A calendar for iPhone, iPad, Mac and Apple Watch with countdowns, medication reminders, car maintenance tracking and nearby on-duty pharmacies.'
  press_long_el: |
    Το Chronos είναι ημερολόγιο για iPhone, iPad, Mac και Apple Watch που δεν σταματά στα ραντεβού. Δείχνει τον μήνα, την εβδομάδα, την ημέρα, το έτος ή μια λίστα, με τον καιρό κάθε ημέρας δίπλα στα γεγονότα, και καταλαβαίνει ό,τι γράφεις όπως θα το έλεγες.

    Μαζεύει σε ένα μέρος όσα συνήθως σκορπίζονται σε σημειώσεις και υπενθυμίσεις: αντίστροφη μέτρηση για γενέθλια και ταξίδια, που μπορείς να τη στείλεις σε φίλο, φάρμακα με έλεγχο αλληλεπιδράσεων, service, ΚΤΕΟ και ασφάλεια του αυτοκινήτου, δάνεια, συνδρομές και συντήρηση του σπιτιού.

    Για την Ελλάδα έχει κάτι που δεν έχει κανένα ξένο ημερολόγιο: γιορτές και εφημερεύοντα φαρμακεία και νοσοκομεία κοντά σου, σε πραγματικό χρόνο. Τα δεδομένα σου μένουν στη συσκευή και στο iCloud σου.
  press_long_en: |
    Chronos is a calendar for iPhone, iPad, Mac and Apple Watch that goes beyond appointments. It shows your month, week, day, year or a simple list, with each day's weather right next to your events, and understands what you type the way you'd say it.

    It brings together everything that usually ends up scattered across notes and reminders: countdowns for birthdays and trips that you can send to a friend, medication with interaction checks, car service, inspections and insurance, loans, subscriptions and home maintenance.

    In Greece it does something no other calendar does: name days, plus on-duty pharmacies and hospitals near you, in real time. Your data stays on your devices and in your own iCloud.
  kind_el: Ημερολόγιο
  kind_en: Calendar
  tagline_el: Ο χρόνος υπό τον έλεγχό σου.
  tagline_en: Your time, under control.
  origin_el: Από τον Χρόνο, την προσωποποίηση του χρόνου στην ελληνική μυθολογία.
  origin_en: Named after Chronos, the personification of time in Greek mythology.
  status_el: Έρχεται τον Δεκέμβριο
  status_en: Coming in December
  features_el:
    - Έξι όψεις ημερολογίου — Λίστα, Ημέρα, Εβδομάδα, Μήνας, Έτος, και συνδυαστική αρχική
    - Αντίστροφη μέτρηση για γενέθλια, επετείους και ό,τι περιμένεις, με δυνατότητα να τη στείλεις σε φίλο
    - Παρακολούθηση συντήρησης αυτοκινήτου — service, λάδια, ΚΤΕΟ, ασφάλεια, με πλήρες ιστορικό
    - Υπενθυμίσεις φαρμάκων με έλεγχο πιθανών αλληλεπιδράσεων
    - Εφημερεύοντα φαρμακεία και νοσοκομεία κοντά σου, σε πραγματικό χρόνο
    - Δάνεια, συντήρηση σπιτιού και συνδρομές — όλη η καθημερινότητα, σε ένα μέρος
  features_en:
    - Six calendar views — List, Day, Week, Month, Year, and a combined Home view
    - Countdown for birthdays, anniversaries and anything you're waiting for — share it with a friend
    - Car maintenance tracking — service, oil, MOT, insurance, with full history
    - Medication reminders with interaction checks
    - Nearby on-duty pharmacies and hospitals, in real time
    - Loans, home maintenance and subscriptions — your whole life admin, in one place
  screenshots: []
