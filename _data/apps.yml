- slug: iris
  title: Iris
  greek: ΙΡΙΔΑ
  icon: /assets/icons/iris.png
  theme: light
  tint: '#F4EDE1'
  accent: '#9A7240'
  logo: /assets/logos/iris-lockup.svg
  logo_size: [356, 141]
  emblem: /assets/logos/iris-emblem.svg
  og_image: /assets/og/iris.jpg
  order: 3
  platforms: [mac]
  has_legal: true
  support_email: iris@dimakis.app
  appstore_url: ''
  appstore_id: ''
  price: ''
  ready: true
  schema_category: PhotographyApplication
  description_el: 'Εφαρμογή για Mac που διορθώνει ημερομηνία και τοποθεσία, γράφει τίτλους και λέξεις-κλειδιά, μετονομάζει αρχεία και βρίσκει διπλότυπες φωτογραφίες.'
  description_en: 'A Mac app that fixes dates and locations, writes titles and keywords, renames files and finds duplicate photos, all locally on your Mac.'
  press_long_el: |
    Το Iris είναι εφαρμογή για Mac που ετοιμάζει τις φωτογραφίες σου πριν μπουν στο αρχείο σου. Διορθώνει ημερομηνία λήψης και τοποθεσία, γράφει τίτλο, περιγραφή και λέξεις-κλειδιά, μετονομάζει μαζικά τα αρχεία και εντοπίζει τα διπλότυπα.

    Όλη η επεξεργασία γίνεται τοπικά, μέσα στο sandbox της Apple, χωρίς να ανεβαίνει τίποτα πουθενά. Είναι ο φυσικός σύντροφος του Apollo: ό,τι τακτοποιεί το Iris, το Apollo το δείχνει σωστά σε άλμπουμ, χάρτη και ταξίδια.
  press_long_en: |
    Iris is a Mac app that gets your photos ready before they join your library. It fixes capture dates and locations, writes titles, descriptions and keywords, bulk-renames files and finds duplicates.

    Everything happens locally, inside Apple's sandbox, with nothing uploaded anywhere. It's the natural companion to Apollo: whatever Iris tidies up, Apollo shows correctly in albums, on the map and in trips.
  kind_el: Βοηθός φωτογραφιών για Mac
  kind_en: Photo companion for Mac
  tagline_el: Ετοιμάζει τις φωτογραφίες σου πριν μπουν στο Apollo.
  tagline_en: Gets your photos ready before they join Apollo.
  origin_el: Από την Ίριδα, τη θεά του ουράνιου τόξου που ένωνε ουρανό και γη· έτσι κι αυτή ενώνει τις φωτογραφίες σου με το Apollo.
  origin_en: Named after Iris, goddess of the rainbow who connected sky and earth — connecting your photos to Apollo, in much the same way.
  status_el: Έρχεται σύντομα
  status_en: Coming soon
  features_el:
    - Διορθώνει ημερομηνία λήψης και τοποθεσία
    - Γράφει τίτλο, περιγραφή και λέξεις-κλειδιά
    - Μαζική μετονομασία αρχείων
    - Εντοπισμός διπλότυπων
    - Όλη η επεξεργασία τοπικά, μέσα στο sandbox της Apple
  features_en:
    - Fixes capture date and GPS location
    - Writes title, description and keywords
    - Bulk renames files
    - Finds duplicates
    - All processing stays local, inside Apple's sandbox
  screenshots:
