- slug: apollo
  title: Apollo
  greek: ΑΠΟΛΛΩΝ
  icon: /assets/icons/apollo.png
  theme: light
  tint: '#FBF3D5'
  accent: '#B07D0A'
  logo: /assets/logos/apollo-lockup.svg
  logo_size: [571, 141]
