<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.page_title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="{{ '/assets/favicon-32.png' | relative_url }}" sizes="32x32">
<link rel="icon" href="{{ '/assets/favicon-16.png' | relative_url }}" sizes="16x16">
<link rel="apple-touch-icon" href="{{ '/assets/favicon-180.png' | relative_url }}">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<style>:root{ --berry: {{ site.data.site.accent }}; }</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="dimakis, αρχική">
    <img src="{{ '/assets/dimakis-logo.svg' | relative_url }}" alt="dimakis">
  </a>
  <nav class="bar-nav">
    <a href="{{ '/#apps' | relative_url }}">Εφαρμογές</a>
    <a href="mailto:{{ site.data.site.contact_email }}">Επικοινωνία</a>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer class="foot">
  <div class="foot-in">
    <img class="foot-logo" src="{{ '/assets/dimakis-logo-dark.svg' | relative_url }}" alt="dimakis">
    <ul class="foot-list">
      {% assign sorted = site.apps | sort: "order" %}
      {% for app in sorted %}
      <li><a href="{{ app.url | relative_url }}">{{ app.title }}</a></li>
      {% endfor %}
    </ul>
    <div class="foot-meta">
      <a href="mailto:{{ site.data.site.contact_email }}">{{ site.data.site.contact_email }}</a>
      <p>{{ site.data.site.footer_note }}</p>
    </div>
  </div>
</footer>
</body>
</html>
