backend:
  name: github
  repo: chrisdim2/chrisdim2.github.io
  branch: main

media_folder: assets/icons
public_folder: /assets/icons

collections:
  - name: apps
    label: Εφαρμογές
    files:
      - name: list
        label: Όλες οι εφαρμογές
        file: _data/apps.yml
        fields:
          - name: list
            label: Εφαρμογές
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: slug, label: Φάκελος (URL), widget: string }
              - { name: title, label: Όνομα, widget: string }
              - { name: full_name, label: Πλήρες όνομα (όπως στο App Store), widget: string, required: false }
              - { name: greek, label: Ελληνικό όνομα, widget: string }
              - { name: order, label: Σειρά, widget: number, value_type: int }
              - { name: platforms, label: Συσκευές, widget: select, multiple: true, required: false, options: [{ label: iPhone, value: iphone }, { label: iPad, value: ipad }, { label: Mac, value: mac }, { label: Apple Watch, value: watch }] }
              - { name: icon, label: Εικονίδιο, widget: image, required: false }
              - { name: kind_el, label: Κατηγορία, widget: string }
              - { name: kind_en, label: Category (EN), widget: string }
              - { name: tagline_el, label: Ατάκα, widget: string }
              - { name: tagline_en, label: Tagline (EN), widget: string }
              - { name: origin_el, label: Προέλευση ονόματος, widget: text }
              - { name: origin_en, label: Origin of the name (EN), widget: text }
              - { name: features_el, label: Χαρακτηριστικά, widget: list, required: false, field: { name: item, label: Χαρακτηριστικό, widget: string } }
              - { name: features_en, label: Features (EN), widget: list, required: false, field: { name: item, label: Feature, widget: string } }
              - { name: screenshots, label: Στιγμιότυπα, widget: list, required: false, field: { name: image, label: Εικόνα, widget: image } }
              - { name: status_el, label: Κατάσταση, widget: string }
              - { name: status_en, label: Status (EN), widget: string }
              - { name: appstore_url, label: Σύνδεσμος App Store, widget: string, required: false }
              - { name: appstore_id, label: Αριθμός App Store (Smart App Banner), widget: string, required: false }
              - { name: price, label: "Τιμή σε € (για το JSON-LD)", widget: string, required: false }
              - { name: ready, label: Έτοιμη (εμφανίζεται στο Press Kit), widget: boolean, default: false }
              - { name: schema_category, label: Κατηγορία schema.org, widget: string, required: false }
              - { name: description_el, label: Περιγραφή για Google (meta description), widget: text }
              - { name: description_en, label: Description for Google (EN), widget: text }
              - { name: press_long_el, label: Μεγάλη περιγραφή (Press Kit), widget: text, required: false }
              - { name: press_long_en, label: Long description (Press Kit, EN), widget: text, required: false }
              - { name: support_email, label: Email υποστήριξης, widget: string }
              - { name: has_legal, label: Έχει νομικά κείμενα, widget: boolean, default: false }

  - name: settings
    label: Κείμενα site
    files:
      - name: site
        label: Γενικά και δύο γλώσσες
        file: _data/site.yml
        fields:
          - { name: accent, label: Χρώμα τόνου, widget: color }
          - { name: contact_email, label: Γενικό email, widget: string }
          - { name: press_email, label: Email για τύπο, widget: string, required: false }
          - { name: owner_name, label: Ονοματεπώνυμο, widget: string, required: false }
          - { name: newsletter_action, label: Διεύθυνση φόρμας newsletter (Buttondown), widget: string, required: false }
          - name: social
            label: Social media
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Όνομα, widget: string }
              - { name: url, label: Σύνδεσμος (κενό = κρυφό), widget: string, required: false }
          - name: el
            label: Ελληνικά
            widget: object
            fields:
              - { name: eyebrow, label: Μικρός τίτλος, widget: string }
              - { name: hero_title, label: Κύριος τίτλος, widget: text }
              - { name: hero_text, label: Εισαγωγή, widget: text }
              - { name: nav_apps, label: Μενού, εφαρμογές, widget: string }
              - { name: nav_contact, label: Μενού, επικοινωνία, widget: string }
              - { name: footer_note, label: Υποσέλιδο, widget: string }
              - { name: support_title, label: Τίτλος υποστήριξης, widget: string }
              - { name: support_text, label: Κείμενο υποστήριξης, widget: text }
              - { name: legal_title, label: Τίτλος νομικών, widget: string }
              - { name: legal_todo, label: Κείμενο εκκρεμών νομικών, widget: string }
              - { name: features_title, label: Τίτλος χαρακτηριστικών, widget: string }
              - { name: origin_title, label: Τίτλος προέλευσης, widget: string }
              - { name: status_soon, label: Κείμενο πριν την κυκλοφορία, widget: string }
              - { name: download, label: Κουμπί λήψης, widget: string }
              - { name: back, label: Επιστροφή, widget: string }
              - { name: lang_other, label: Άλλη γλώσσα, widget: string }
              - { name: languages_title, label: Τίτλος γλωσσών, widget: string }
              - { name: languages_badge, label: "Γλώσσες, σήμα (%n = πλήθος)", widget: string }
              - { name: languages_text, label: "Γλώσσες, κείμενο (%n = πλήθος)", widget: string }
              - { name: platforms_label, label: Συσκευές (για αναγνώστες οθόνης), widget: string }
              - { name: home_title, label: "Τίτλος αρχικής (Google)", widget: string, required: false }
              - { name: nav_press, label: "Μενού, press kit", widget: string, required: false }
              - { name: nav_articles, label: "Μενού, άρθρα", widget: string, required: false }
              - { name: footer_more, label: "Υποσέλιδο, περισσότερα", widget: string, required: false }
              - { name: footer_social, label: "Υποσέλιδο, social", widget: string, required: false }
              - { name: notify_title, label: "Ειδοποίηση, τίτλος", widget: string, required: false }
              - { name: notify_title_app, label: "Ειδοποίηση, τίτλος εφαρμογής (%app)", widget: string, required: false }
              - { name: notify_text, label: "Ειδοποίηση, κείμενο", widget: string, required: false }
              - { name: notify_label, label: "Ειδοποίηση, πεδίο", widget: string, required: false }
              - { name: notify_placeholder, label: "Ειδοποίηση, παράδειγμα", widget: string, required: false }
              - { name: notify_button, label: "Ειδοποίηση, κουμπί", widget: string, required: false }
              - { name: notify_note, label: "Ειδοποίηση, σημείωση", widget: string, required: false }
              - { name: articles_title, label: "Άρθρα, τίτλος", widget: string, required: false }
              - { name: articles_text, label: "Άρθρα, εισαγωγή", widget: string, required: false }
              - { name: articles_empty, label: "Άρθρα, κενή λίστα", widget: string, required: false }
              - { name: article_draft, label: "Άρθρα, πρόχειρο", widget: string, required: false }
              - { name: read_more, label: "Διάβασε", widget: string, required: false }
          - name: en
            label: English
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: string }
              - { name: hero_title, label: Hero title, widget: text }
              - { name: hero_text, label: Hero text, widget: text }
              - { name: nav_apps, label: Nav, apps, widget: string }
              - { name: nav_contact, label: Nav, contact, widget: string }
              - { name: footer_note, label: Footer note, widget: string }
              - { name: support_title, label: Support title, widget: string }
              - { name: support_text, label: Support text, widget: text }
              - { name: legal_title, label: Legal title, widget: string }
              - { name: legal_todo, label: Legal pending text, widget: string }
              - { name: features_title, label: Features title, widget: string }
              - { name: origin_title, label: Origin title, widget: string }
              - { name: status_soon, label: Pre-release text, widget: string }
              - { name: download, label: Download button, widget: string }
              - { name: back, label: Back link, widget: string }
              - { name: lang_other, label: Other language, widget: string }
              - { name: languages_title, label: Languages title, widget: string }
              - { name: languages_badge, label: "Languages badge (%n = count)", widget: string }
              - { name: languages_text, label: "Languages text (%n = count)", widget: string }
              - { name: platforms_label, label: Platforms (for screen readers), widget: string }
              - { name: home_title, label: "Τίτλος αρχικής (Google)", widget: string, required: false }
              - { name: nav_press, label: "Μενού, press kit", widget: string, required: false }
              - { name: nav_articles, label: "Μενού, άρθρα", widget: string, required: false }
              - { name: footer_more, label: "Υποσέλιδο, περισσότερα", widget: string, required: false }
              - { name: footer_social, label: "Υποσέλιδο, social", widget: string, required: false }
              - { name: notify_title, label: "Ειδοποίηση, τίτλος", widget: string, required: false }
              - { name: notify_title_app, label: "Ειδοποίηση, τίτλος εφαρμογής (%app)", widget: string, required: false }
              - { name: notify_text, label: "Ειδοποίηση, κείμενο", widget: string, required: false }
              - { name: notify_label, label: "Ειδοποίηση, πεδίο", widget: string, required: false }
              - { name: notify_placeholder, label: "Ειδοποίηση, παράδειγμα", widget: string, required: false }
              - { name: notify_button, label: "Ειδοποίηση, κουμπί", widget: string, required: false }
              - { name: notify_note, label: "Ειδοποίηση, σημείωση", widget: string, required: false }
              - { name: articles_title, label: "Άρθρα, τίτλος", widget: string, required: false }
              - { name: articles_text, label: "Άρθρα, εισαγωγή", widget: string, required: false }
              - { name: articles_empty, label: "Άρθρα, κενή λίστα", widget: string, required: false }
              - { name: article_draft, label: "Άρθρα, πρόχειρο", widget: string, required: false }
              - { name: read_more, label: "Διάβασε", widget: string, required: false }
